<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sudoku">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Sudoku</title>
<style>
:root{--bg:#fff;--text:#344861;--given:#344861;--user:#325aaf;--line:#bec6d4;--thick:#344861;--peer:#e2ebf3;--same:#c3d7ea;--sel:#bbdefb;--err:#e55c6c;--errbg:#f7cfd6;--muted:#6e7c8c;--btn:#eaeef4;--accent:#325aaf;--card:#fff;--shadow:0 10px 40px rgba(0,0,0,.18)}
.dark{--bg:#1b1f27;--text:#d7dde6;--given:#d7dde6;--user:#86a9ff;--line:#363d4a;--thick:#8a94a6;--peer:#242a35;--same:#2f3b52;--sel:#34507e;--err:#ff6b7c;--errbg:#4a2a33;--muted:#8a94a6;--btn:#2a303c;--accent:#7fa2ff;--card:#252a34;--shadow:0 10px 40px rgba(0,0,0,.5)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-user-select:none;user-select:none;touch-action:manipulation;transition:background .2s}
button{font-family:inherit;cursor:pointer}
.app{max-width:500px;margin:0 auto;padding:calc(10px + env(safe-area-inset-top,0px)) calc(12px + env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:9px;min-height:100dvh}
header{display:flex;align-items:center;justify-content:space-between}
h1{font-size:24px;margin:0;font-weight:800;letter-spacing:.2px}
.iconbtn{background:none;border:0;color:var(--muted);width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.iconbtn:active{background:var(--btn)}
.diffs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:0 -4px}
.diffs::-webkit-scrollbar{display:none}
.chip{flex:none;border:0;background:none;color:var(--muted);font-size:14px;padding:6px 11px;border-radius:16px;font-weight:500}
.chip.on{color:var(--accent);background:var(--btn);font-weight:700}
.info{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--muted)}
.info b{color:var(--text);font-weight:600;font-variant-numeric:tabular-nums}
.timer{display:flex;align-items:center;gap:4px}
.timer .iconbtn{width:30px;height:30px}
.boardwrap{position:relative;width:min(100%,max(280px,calc(100dvh - 290px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px))));aspect-ratio:1;margin:0 auto;container-type:inline-size}
.board{display:grid;grid-template-columns:repeat(9,1fr);grid-template-rows:repeat(9,1fr);width:100%;height:100%;border:2px solid var(--thick);border-radius:4px;overflow:hidden}
.cell{position:relative;display:flex;align-items:center;justify-content:center;border-right:1px solid var(--line);border-bottom:1px solid var(--line);font-size:7.2cqw;color:var(--user);background:var(--bg);cursor:pointer;line-height:1}
.cell.bx{border-right:2px solid var(--thick)}
.cell.by{border-bottom:2px solid var(--thick)}
.cell.c8{border-right:0}.cell.r8{border-bottom:0}
.cell.given{color:var(--given)}
.cell.wrong{color:var(--err)}
.cell.peer{background:var(--peer)}
.cell.same{background:var(--same)}
.cell.conflict{background:var(--errbg)}
.cell.sel{background:var(--sel)}
.cell.flash{animation:flash .55s ease-out both}
@keyframes flash{0%{background:var(--sel)}40%{background:var(--same)}100%{}}
.v.pop{animation:pop .22s ease-out}
@keyframes pop{0%{transform:scale(.5)}70%{transform:scale(1.15)}100%{transform:scale(1)}}
.v.shake{animation:shake .3s}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-12%)}75%{transform:translateX(12%)}}
.notes{position:absolute;inset:1px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);font-size:2.7cqw;color:var(--muted)}
.notes span{display:flex;align-items:center;justify-content:center}
.notes span.hl{color:var(--accent);font-weight:800}
.overlay{position:absolute;inset:0;display:none;flex-direction:column;gap:10px;align-items:center;justify-content:center;background:var(--bg);border:2px solid var(--thick);border-radius:4px;color:var(--muted);font-size:15px}
.overlay.show{display:flex}
.play{width:72px;height:72px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center}
.spinner{width:34px;height:34px;border:3px solid var(--btn);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.ctrls{display:flex;justify-content:space-around;padding-top:4px}
.ctl{display:flex;flex-direction:column;align-items:center;gap:5px;background:none;border:0;color:var(--muted);font-size:12.5px;padding:0}
.ctl .ic{width:50px;height:50px;border-radius:50%;background:var(--btn);display:grid;place-items:center;position:relative;color:var(--accent);transition:transform .1s}
.ctl:active .ic{transform:scale(.92)}
.badge{position:absolute;top:-3px;right:-9px;background:var(--muted);color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:9px;border:2px solid var(--bg)}
.ctl.on .badge{background:var(--accent)}
.ctl.on .ic{background:var(--accent);color:#fff}
.pad{display:grid;grid-template-columns:repeat(9,1fr)}
.num{background:none;border:0;color:var(--accent);font-size:clamp(30px,9.5vw,44px);height:60px;border-radius:8px;font-weight:400;padding:0;position:relative}
.num:active{background:var(--btn)}
.num.done{visibility:hidden}
.notesmode .num{color:var(--muted)}
.num small{position:absolute;left:0;right:0;bottom:2px;font-size:10px;color:var(--muted)}
header{position:relative}
.menu{position:absolute;top:44px;right:0;z-index:15;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:6px;min-width:240px;display:none;transform-origin:top right}
.menu.show{display:block;animation:menuin .15s ease-out}
@keyframes menuin{from{opacity:0;transform:scale(.94)}}
.mi{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;color:var(--text);font-size:15.5px;padding:12px;border-radius:9px;text-align:left}
.mi:active{background:var(--btn)}
.mi svg{color:var(--accent);flex:none}
.msep{height:1px;background:var(--line);margin:4px 10px}
.sw{margin-left:auto;width:42px;height:25px;border-radius:13px;background:var(--line);position:relative;transition:background .2s;flex:none}
.sw::after{content:'';position:absolute;top:2.5px;left:2.5px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw.on{background:var(--accent)}
.sw.on::after{transform:translateX(17px)}
.mbg{position:fixed;inset:0;background:rgba(20,28,40,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
.mbg.show{display:flex}
.modal{background:var(--card);border-radius:16px;padding:22px 20px 16px;width:100%;max-width:340px;box-shadow:var(--shadow);text-align:center;animation:rise .2s ease-out}
@keyframes rise{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.modal h2{margin:0 0 6px;font-size:21px}
.modal p{margin:0 0 14px;color:var(--muted);font-size:14.5px;line-height:1.4}
.modal .list{display:flex;flex-direction:column;gap:2px;margin-bottom:6px}
.mbtn{display:block;width:100%;border:0;background:none;color:var(--accent);font-size:16px;font-weight:500;padding:13px;border-radius:10px}
.mbtn:active{background:var(--btn)}
.mbtn.primary{background:var(--accent);color:#fff;font-weight:600;margin-top:6px}
.mbtn.muted{color:var(--muted)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:14px 0 8px}
.stat{background:var(--btn);border-radius:10px;padding:10px 6px}
.stat div{font-size:12px;color:var(--muted);margin-bottom:3px}
.stat b{font-size:19px;font-variant-numeric:tabular-nums}
.trophy{font-size:44px;line-height:1;margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:20px;font-size:14px;opacity:0;pointer-events:none;transition:.2s;z-index:20}
.toast.show{opacity:1;transform:translateX(-50%)}
svg{display:block}
</style>
</head>
<body>
<div class="app" id="app">
  <header>
    <h1>Sudoku</h1>
    <div style="display:flex">
      <button class="iconbtn" id="menuBtn" aria-label="Menu"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    </div>
    <div class="menu" id="menu">
      <button class="mi" id="miNew"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>New Game</button>
      <button class="mi" id="miRestart"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>Restart puzzle</button>
      <div class="msep"></div>
      <button class="mi" id="miSound"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>Sound<span class="sw" id="swSound"></span></button>
      <button class="mi" id="miDark"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>Dark mode<span class="sw" id="swDark"></span></button>
    </div>
  </header>
  <div class="diffs" id="diffs"></div>
  <div class="info">
    <span>Mistakes: <b id="mistakes">0/3</b></span>
    <span>Score: <b id="score">0</b></span>
    <span class="timer"><b id="time">00:00</b><button class="iconbtn" id="pauseBtn" aria-label="Pause"></button></span>
  </div>
  <div class="boardwrap">
    <div class="board" id="board"></div>
    <div class="overlay" id="pauseOv"><button class="play" id="playBtn" aria-label="Resume"><svg width="30" height="30" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button><span>Game paused</span></div>
    <div class="overlay" id="loadOv"><div class="spinner"></div><span>Generating puzzle…</span></div>
  </div>
  <div class="ctrls">
    <button class="ctl" id="undoBtn"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h11a5 5 0 0 1 0 10h-3"/></svg></span>Undo</button>
    <button class="ctl" id="eraseBtn"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20H8l-4.3-4.3a1.5 1.5 0 0 1 0-2.1L13.6 3.7a1.5 1.5 0 0 1 2.1 0l4.6 4.6a1.5 1.5 0 0 1 0 2.1L10.5 20"/><path d="M8.5 9.5l6 6"/></svg></span>Erase</button>
    <button class="ctl" id="notesBtn"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg><span class="badge" id="notesBadge">OFF</span></span>Notes</button>
    <button class="ctl" id="hintBtn"><span class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6"/><path d="M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.3h6c0-1 .4-1.8 1-2.3A7 7 0 0 0 12 2z"/></svg><span class="badge" id="hintBadge">3</span></span>Hint</button>
  </div>
  <div class="pad" id="pad"></div>
</div>
<div class="mbg" id="mbg"><div class="modal" id="modal"></div></div>
<div class="toast" id="toast"></div>

<script>
(function(){
const $=s=>document.getElementById(s);
const DIFFS=[['easy','Easy',38,10],['medium','Medium',32,20],['hard','Hard',28,30],['expert','Expert',25,45],['master','Master',23,60],['extreme','Extreme',21,80]];
const D={};DIFFS.forEach(([k,n,c,p])=>D[k]={name:n,clues:c,pts:p});
const R=[],C=[],B=[];
for(let i=0;i<81;i++){R[i]=i/9|0;C[i]=i%9;B[i]=(R[i]/3|0)*3+(C[i]/3|0);}
const PEERS=[],PEERSET=[];
for(let i=0;i<81;i++){const s=[];for(let j=0;j<81;j++)if(j!==i&&(R[j]===R[i]||C[j]===C[i]||B[j]===B[i]))s.push(j);PEERS[i]=s;PEERSET[i]=new Set(s);}
const UNITS={r:[],c:[],b:[]};
for(let k=0;k<9;k++){UNITS.r[k]=[];UNITS.c[k]=[];UNITS.b[k]=[];}
for(let i=0;i<81;i++){UNITS.r[R[i]].push(i);UNITS.c[C[i]].push(i);UNITS.b[B[i]].push(i);}
const pc=m=>{let n=0;while(m){m&=m-1;n++;}return n;};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

/* ---------- solver / generator ---------- */
function solve(grid,limit,rand){
  const g=grid.slice(),row=new Array(9).fill(0),col=new Array(9).fill(0),box=new Array(9).fill(0);
  for(let i=0;i<81;i++)if(g[i]){const b=1<<g[i];row[R[i]]|=b;col[C[i]]|=b;box[B[i]]|=b;}
  let count=0,sol=null;
  (function rec(){
    let best=-1,bm=0,bc=10;
    for(let i=0;i<81;i++)if(!g[i]){
      const m=~(row[R[i]]|col[C[i]]|box[B[i]])&0x3FE,n=pc(m);
      if(n<bc){bc=n;best=i;bm=m;if(n<=1)break;}
    }
    if(best<0){count++;if(!sol)sol=g.slice();return;}
    if(bc===0)return;
    const ds=[];for(let d=1;d<=9;d++)if(bm&(1<<d))ds.push(d);
    if(rand)shuffle(ds);
    const r=R[best],c=C[best],x=B[best];
    for(const d of ds){
      const b=1<<d;g[best]=d;row[r]|=b;col[c]|=b;box[x]|=b;
      rec();
      row[r]^=b;col[c]^=b;box[x]^=b;g[best]=0;
      if(count>=limit)return;
    }
  })();
  return {count,sol};
}
function generate(diff){
  const target=D[diff].clues,t0=performance.now();let best=null;
  for(let a=0;a<15;a++){
    const sol=solve(new Array(81).fill(0),1,true).sol,p=sol.slice();let clues=81;
    for(const i of shuffle([...Array(81).keys()])){
      if(clues<=target)break;
      const v=p[i];p[i]=0;
      if(solve(p,2).count!==1)p[i]=v;else clues--;
    }
    if(!best||clues<best.clues)best={puzzle:p,solution:sol,clues};
    if(clues<=target||performance.now()-t0>1800)break;
  }
  return best;
}

/* ---------- state ---------- */
const KEY='sudoku-game-v1';
let S=null,modalOpen=false;
const flashing=new Map();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}};
const load=()=>{try{const s=JSON.parse(localStorage.getItem(KEY));return s&&s.solution&&s.values?s:null;}catch(e){return null;}};
const getBest=()=>{try{return JSON.parse(localStorage.getItem(KEY+'-best'))||{};}catch(e){return {};}};
const setBest=b=>{try{localStorage.setItem(KEY+'-best',JSON.stringify(b));}catch(e){}};
const fmt=t=>{const h=t/3600|0,m=(t/60|0)%60,s=t%60;return (h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(s).padStart(2,'0');};
/* ---------- sound ---------- */
let actx=null,soundOn=true;
try{soundOn=localStorage.getItem(KEY+'-sound')!=='0';}catch(e){}
function ac(){
  if(!actx){const A=window.AudioContext||window.webkitAudioContext;if(!A)return null;actx=new A();}
  if(actx.state==='suspended')actx.resume();return actx;
}
function tone(f1,f2,dur,type,vol,delay){
  const a=ac();if(!a)return;
  const t=a.currentTime+(delay||0),o=a.createOscillator(),g=a.createGain();
  o.type=type;o.frequency.setValueAtTime(f1,t);o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+dur+0.03);
}
const SFX={
  place(){tone(880,640,0.10,'sine',0.28);tone(1760,1280,0.06,'sine',0.07);},
  note(){tone(1250,1050,0.045,'triangle',0.10);},
  wrong(){tone(170,140,0.12,'square',0.075);tone(170,135,0.15,'square',0.075,0.15);}
};
function sfx(n){if(!soundOn)return;try{SFX[n]();}catch(e){}}
function renderSound(){$('swSound').classList.toggle('on',soundOn);}
renderSound();
const blocked=()=>!S||S.over||S.won||S.paused||modalOpen;

/* ---------- build DOM ---------- */
const board=$('board'),cells=[];
for(let i=0;i<81;i++){
  const el=document.createElement('div');
  el._base=' '+[C[i]%3===2?'bx':'',R[i]%3===2?'by':'',C[i]===8?'c8':'',R[i]===8?'r8':''].join(' ');
  el.addEventListener('pointerdown',e=>{e.preventDefault();if(!S||S.paused)return;S.sel=i;render();save();});
  board.appendChild(el);cells.push(el);
}
const pad=$('pad'),nums=[];
for(let d=1;d<=9;d++){
  const b=document.createElement('button');b.className='num';b.textContent=d;
  b.addEventListener('click',()=>input(d));pad.appendChild(b);nums.push(b);
}
const diffs=$('diffs');
DIFFS.forEach(([k,n])=>{
  const b=document.createElement('button');b.className='chip';b.textContent=n;b.dataset.k=k;
  b.addEventListener('click',()=>askNew(k));diffs.appendChild(b);
});

/* ---------- render ---------- */
function render(){
  if(!S)return;
  const sel=S.sel,sv=sel>=0?S.values[sel]:0,selWrong=sel>=0&&sv&&sv!==S.solution[sel];
  for(let i=0;i<81;i++){
    const el=cells[i],v=S.values[i];
    let cls='cell'+el._base;
    if(S.puzzle[i])cls+=' given';else if(v&&v!==S.solution[i])cls+=' wrong';
    if(sel>=0){
      if(i===sel)cls+=' sel';
      else if(sv&&v===sv)cls+=(selWrong&&PEERSET[sel].has(i))?' conflict':' same';
      else if(PEERSET[sel].has(i))cls+=' peer';
    }
    if(flashing.has(i)){cls+=' flash';el.style.animationDelay=flashing.get(i)+'ms';}
    if(el.className!==cls)el.className=cls;
    let h;
    if(v)h='<span class="v">'+v+'</span>';
    else if(S.notes[i]){h='<div class="notes">';for(let d=1;d<=9;d++)h+='<span'+(sv===d&&S.notes[i]&(1<<d)?' class="hl"':'')+'>'+(S.notes[i]&(1<<d)?d:'')+'</span>';h+='</div>';}
    else h='';
    if(el._h!==h){el.innerHTML=h;el._h=h;}
  }
  const cnt=new Array(10).fill(0);
  for(let i=0;i<81;i++)if(S.values[i]&&S.values[i]===S.solution[i])cnt[S.values[i]]++;
  nums.forEach((b,k)=>b.classList.toggle('done',cnt[k+1]>=9));
  $('mistakes').textContent=S.mistakes+'/3';
  $('score').textContent=S.score;
  $('time').textContent=fmt(S.time);
  $('notesBadge').textContent=S.notesMode?'ON':'OFF';
  $('notesBtn').classList.toggle('on',S.notesMode);
  $('app').classList.toggle('notesmode',S.notesMode);
  $('hintBadge').textContent=S.hints;
  [...diffs.children].forEach(b=>b.classList.toggle('on',b.dataset.k===S.diff));
  $('pauseOv').classList.toggle('show',!!S.paused);
  $('pauseBtn').innerHTML=S.paused
    ?'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>'
    :'<svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>';
}
function animV(i,cls){const s=cells[i].querySelector('.v');if(s){s.classList.remove(cls);void s.offsetWidth;s.classList.add(cls);}}

/* ---------- actions ---------- */
function clearPeerNotes(i,v,h){for(const j of PEERS[i])if(S.notes[j]&(1<<v)){h.peers.push([j,S.notes[j]]);S.notes[j]&=~(1<<v);}}
function input(v){
  if(blocked())return;const i=S.sel;
  if(i<0){toast('Select a cell first');return;}
  if(S.puzzle[i]||(S.values[i]&&S.values[i]===S.solution[i]))return;
  if(S.notesMode){
    if(S.values[i])return;
    S.hist.push({i,v:0,n:S.notes[i],peers:[]});S.notes[i]^=1<<v;sfx('note');render();save();return;
  }
  if(S.values[i]===v)return;
  const h={i,v:S.values[i],n:S.notes[i],peers:[]};
  S.values[i]=v;S.notes[i]=0;
  if(v===S.solution[i]){
    S.score+=D[S.diff].pts;clearPeerNotes(i,v,h);S.hist.push(h);sfx('place');
    render();animV(i,'pop');checkUnits(i);checkWin();
  }else{
    S.mistakes++;S.hist.push(h);sfx('wrong');render();animV(i,'shake');
    if(navigator.vibrate)try{navigator.vibrate(60);}catch(e){}
    if(S.mistakes>=3){S.over=true;setTimeout(gameOver,350);}
  }
  save();
}
function undo(){
  if(blocked())return;const h=S.hist.pop();
  if(!h){toast('Nothing to undo');return;}
  S.values[h.i]=h.v;S.notes[h.i]=h.n;for(const [j,n] of h.peers)S.notes[j]=n;
  S.sel=h.i;render();save();
}
function erase(){
  if(blocked())return;const i=S.sel;
  if(i<0||S.puzzle[i])return;
  if(S.values[i]&&S.values[i]===S.solution[i])return;
  if(!S.values[i]&&!S.notes[i])return;
  S.hist.push({i,v:S.values[i],n:S.notes[i],peers:[]});S.values[i]=0;S.notes[i]=0;render();save();
}
function hint(){
  if(blocked())return;
  if(S.hints<=0){toast('No hints left in this game');return;}
  let i=S.sel;
  if(i<0||S.values[i]===S.solution[i]){
    const open=[];for(let j=0;j<81;j++)if(S.values[j]!==S.solution[j])open.push(j);
    if(!open.length)return;i=open[Math.random()*open.length|0];S.sel=i;
  }
  const v=S.solution[i],h={i,v:S.values[i],n:S.notes[i],peers:[]};
  S.values[i]=v;S.notes[i]=0;clearPeerNotes(i,v,h);S.hist.push(h);S.hints--;sfx('place');
  render();animV(i,'pop');checkUnits(i);checkWin();save();
}
function toggleNotes(){if(!S||S.over||S.won)return;S.notesMode=!S.notesMode;render();save();}
function setPaused(p){if(!S||S.over||S.won)return;S.paused=p;render();save();}
function checkUnits(i){
  const groups=[UNITS.r[R[i]],UNITS.c[C[i]],UNITS.b[B[i]]];let any=false;
  for(const u of groups)if(u.every(j=>S.values[j]===S.solution[j])){
    any=true;u.forEach(j=>{const d=Math.abs(R[j]-R[i])*35+Math.abs(C[j]-C[i])*35;if(!flashing.has(j)||flashing.get(j)>d)flashing.set(j,d);});
  }
  if(any){render();setTimeout(()=>{flashing.clear();render();},900);}
}
function checkWin(){
  for(let i=0;i<81;i++)if(S.values[i]!==S.solution[i])return;
  S.won=true;S.sel=-1;
  const best=getBest(),prev=best[S.diff];let rec=false;
  if(!prev||S.time<prev.time){best[S.diff]={time:S.time,score:S.score};rec=!!prev||true;setBest(best);}
  const all=[...Array(81).keys()];all.forEach(j=>flashing.set(j,(R[j]+C[j])*30));
  render();setTimeout(()=>{flashing.clear();render();winModal(rec,prev);},1000);save();
}

/* ---------- games ---------- */
function newGame(diff){
  closeModal();$('loadOv').classList.add('show');
  setTimeout(()=>{
    const g=generate(diff);
    S={diff,puzzle:g.puzzle,solution:g.solution,values:g.puzzle.slice(),notes:new Array(81).fill(0),mistakes:0,score:0,time:0,hints:3,notesMode:false,sel:-1,hist:[],over:false,won:false,paused:false};
    $('loadOv').classList.remove('show');render();save();
  },40);
}
function restart(){
  closeModal();
  Object.assign(S,{values:S.puzzle.slice(),notes:new Array(81).fill(0),mistakes:0,score:0,time:0,hints:3,notesMode:false,sel:-1,hist:[],over:false,won:false,paused:false});
  render();save();
}
function inProgress(){return S&&!S.over&&!S.won&&S.hist.length>0;}
function askNew(diff){
  if(!inProgress()){newGame(diff);return;}
  modal(`<h2>Start new game?</h2><p>Your current progress will be lost. Start a new <b>${D[diff].name}</b> game?</p>
  <button class="mbtn primary" data-a="new" data-k="${diff}">New ${D[diff].name} Game</button>
  <button class="mbtn muted" data-a="close">Cancel</button>`);
}
function newGameModal(){
  let h='<h2>New Game</h2><p>Choose a difficulty</p><div class="list">';
  DIFFS.forEach(([k,n])=>h+=`<button class="mbtn" data-a="new" data-k="${k}">${n}</button>`);
  h+='</div>';
  if(S&&!S.won)h+='<button class="mbtn muted" data-a="restart">Restart this puzzle</button>';
  h+='<button class="mbtn muted" data-a="close">Cancel</button>';
  modal(h);
}
function gameOver(){
  modal(`<h2>Game Over</h2><p>You made 3 mistakes and lost this game.</p>
  <button class="mbtn primary" data-a="second">Second Chance</button>
  <button class="mbtn" data-a="newmenu">New Game</button>`);
}
function winModal(rec,prev){
  const best=getBest()[S.diff];
  modal(`<div class="trophy">🏆</div><h2>Excellent!</h2><p>You solved a ${D[S.diff].name} puzzle${rec&&prev?' — new best time!':'.'}</p>
  <div class="stats"><div class="stat"><div>Time</div><b>${fmt(S.time)}</b></div><div class="stat"><div>Score</div><b>${S.score}</b></div>
  <div class="stat"><div>Best time</div><b>${best?fmt(best.time):'—'}</b></div><div class="stat"><div>Mistakes</div><b>${S.mistakes}/3</b></div></div>
  <button class="mbtn primary" data-a="new" data-k="${S.diff}">New ${D[S.diff].name} Game</button>
  <button class="mbtn" data-a="newmenu">Change difficulty</button>`);
}

/* ---------- modal / toast ---------- */
function modal(h){$('modal').innerHTML=h;$('mbg').classList.add('show');modalOpen=true;}
function closeModal(){$('mbg').classList.remove('show');modalOpen=false;}
$('mbg').addEventListener('click',e=>{
  if(e.target.id==='mbg'){if(S&&!S.over)closeModal();return;}
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a;
  if(a==='close')closeModal();
  else if(a==='new')newGame(b.dataset.k);
  else if(a==='newmenu')newGameModal();
  else if(a==='restart')restart();
  else if(a==='second'){S.over=false;S.mistakes=2;closeModal();render();save();}
});
let tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),1600);}

/* ---------- wiring ---------- */
$('undoBtn').addEventListener('click',undo);
$('eraseBtn').addEventListener('click',erase);
$('notesBtn').addEventListener('click',toggleNotes);
$('hintBtn').addEventListener('click',hint);
$('pauseBtn').addEventListener('click',()=>setPaused(!S.paused));
$('playBtn').addEventListener('click',()=>setPaused(false));
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S&&!S.over&&!S.won){S.paused=true;render();save();}});
document.addEventListener('keydown',e=>{
  if(!S||modalOpen)return;
  const k=e.key;
  if(k>='1'&&k<='9'){input(+k);return;}
  if(k==='Backspace'||k==='Delete'||k==='0'){erase();return;}
  if((e.ctrlKey||e.metaKey)&&k.toLowerCase()==='z'){e.preventDefault();undo();return;}
  if(k==='n'||k==='N'){toggleNotes();return;}
  if(k==='h'||k==='H'){hint();return;}
  if(k===' '){e.preventDefault();setPaused(!S.paused);return;}
  const mv={ArrowUp:-9,ArrowDown:9,ArrowLeft:-1,ArrowRight:1}[k];
  if(mv&&!S.paused){e.preventDefault();
    if(S.sel<0)S.sel=40;else{let r=R[S.sel],c=C[S.sel];if(mv===-9)r=(r+8)%9;if(mv===9)r=(r+1)%9;if(mv===-1)c=(c+8)%9;if(mv===1)c=(c+1)%9;S.sel=r*9+c;}
    render();
  }
});
setInterval(()=>{
  if(S&&!S.over&&!S.won&&!S.paused&&!document.hidden&&!modalOpen&&!$('loadOv').classList.contains('show')){
    S.time++;$('time').textContent=fmt(S.time);if(S.time%5===0)save();
  }
},1000);

/* theme */
function applyTheme(d){if($('swDark'))$('swDark').classList.toggle('on',d);document.documentElement.classList.toggle('dark',d);document.querySelector('meta[name=theme-color]').content=d?'#1b1f27':'#ffffff';}
let dark=false;try{dark=localStorage.getItem(KEY+'-dark')==='1';}catch(e){}
applyTheme(dark);
function renderDark(){$('swDark').classList.toggle('on',dark);}
renderDark();
const menu=$('menu');
function closeMenu(){menu.classList.remove('show');}
$('menuBtn').addEventListener('click',e=>{e.stopPropagation();menu.classList.toggle('show');});
document.addEventListener('pointerdown',e=>{if(menu.classList.contains('show')&&!menu.contains(e.target)&&!e.target.closest('#menuBtn'))closeMenu();});
$('miNew').addEventListener('click',()=>{closeMenu();newGameModal();});
$('miRestart').addEventListener('click',()=>{closeMenu();if(!S)return;
  if(!S.hist.length&&!S.over&&!S.won){toast('Nothing to restart yet');return;}
  modal('<h2>Restart puzzle?</h2><p>This clears your numbers, notes, mistakes and timer for this puzzle.</p><button class="mbtn primary" data-a="restart">Restart</button><button class="mbtn muted" data-a="close">Cancel</button>');});
$('miSound').addEventListener('click',()=>{soundOn=!soundOn;try{localStorage.setItem(KEY+'-sound',soundOn?'1':'0');}catch(e){}renderSound();if(soundOn)sfx('place');});
$('miDark').addEventListener('click',()=>{dark=!dark;applyTheme(dark);try{localStorage.setItem(KEY+'-dark',dark?'1':'0');}catch(e){}});

/* start */
S=load();
if(S){if(S.over)setTimeout(gameOver,50);render();}else newGame('easy');
})();
</script>
<script>
if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{});});}
</script>
